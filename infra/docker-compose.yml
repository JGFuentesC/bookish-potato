name: genbi

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER no definida: ejecuta direnv allow o revisa .envrc.local}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD no definida: ejecuta direnv allow o revisa .envrc.local}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB no definida: ejecuta direnv allow o revisa .envrc.local}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-sidecar:
    build:
      context: ..
      dockerfile: infra/Dockerfile.sidecar
    image: genbi-ai-sidecar:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8000"
      # Ollama se alcanza desde el contenedor vía el túnel SSH del host
      # (host.docker.internal). No usar OLLAMA_BASE_URL externa aquí.
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_LLM_MODEL: "${OLLAMA_LLM_MODEL:-gemma4:latest}"
      LAKEHOUSE_PATH: /lakehouse/gold
      QUERY_TIMEOUT_MS: ${QUERY_TIMEOUT_MS:-30000}
      MAX_ROWS: ${MAX_ROWS:-1000}
    volumes:
      - lakehouse:/lakehouse:ro
    # Solo loopback: el sidecar no debe exponerse a la red; todo el acceso
    # pasa por el app (:8081) con JWT.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile.app
    image: genbi-app:latest
    environment:
      PORT: "8080"
      LAKEHOUSE_PATH: /lakehouse/gold
      # Interno: el app solo habla con el sidecar por la red del compose.
      SIDECAR_URL: "http://ai-sidecar:8000"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      QUERY_TIMEOUT_MS: ${QUERY_TIMEOUT_MS:-30000}
      MAX_ROWS: ${MAX_ROWS:-1000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: "${JWT_SECRET:-}"
      AUTH_EMAIL: "${AUTH_EMAIL:-user@genbi.com}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:-password123}"
    volumes:
      - lakehouse:/lakehouse:ro
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-sidecar:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  lakehouse:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../lakehouse
