services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rama-postgres
    environment:
      POSTGRES_USER: rama
      POSTGRES_PASSWORD: rama
      POSTGRES_DB: rama
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rama -d rama"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./docker/api
    container_name: rama-api
    environment:
      DATABASE_URL: postgresql://rama:rama@postgres:5432/rama
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
