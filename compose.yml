services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rama-postgres-oltp
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rama}
      POSTGRES_DB: ${POSTGRES_DB:-rama}
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rama} -d ${POSTGRES_DB:-rama}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
