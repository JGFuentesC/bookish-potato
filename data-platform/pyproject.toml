[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genbi-data"
version = "0.1.0"
description = "Plataforma de datos GenBI: contratos, ingesta y lakehouse"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "polars>=1.0",
    "pyarrow>=17",
    "psycopg[binary]>=3.2",
    "duckdb>=1.1",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/genbi_data"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]