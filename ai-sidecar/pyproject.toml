[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genbi-ai"
version = "0.1.0"
description = "Sidecar de IA GenBI: agente ADK, capa semántica y NLtoSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.10",
    "httpx>=0.28",
    "duckdb>=1.1",
    "sqlglot>=26",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/genbi_ai"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]